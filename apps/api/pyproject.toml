[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for the YazItMean conversation intelligence platform"
readme = "README.md"
authors = [{ name = "Issam Hadjal", email = "issam.hadjal@outlook.fr" }]
requires-python = ">=3.13"
dependencies = ["fastapi>=0.165.0", "uvicorn[standard]>=0.54.0"]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx2>=2.16.2", "pytest>=9.2.0", "ruff>=0.17.6"]

[tool.ruff.lint.isort]
known-first-party = ["api"]
